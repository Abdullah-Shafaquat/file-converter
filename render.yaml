# Render.com blueprint for the FastAPI backend.
#
# Deploy on Render: New -> Blueprint -> point at this repo.
# Render reads the root Dockerfile, which copies backend/ into the image.
#
# Free tier note: the service sleeps after ~15 minutes of inactivity, so the
# first request after a lull takes 30-60 seconds while it wakes up. The
# frontend's 120s request timeout covers this.
services:
  - type: web
    name: file-converter-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: FILE_RETENTION_MINUTES
        value: "30"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: CONVERSION_TIMEOUT_SECONDS
        value: "900"
      # Set this in the Render dashboard to your Vercel URL once it exists,
      # e.g. https://frontend-two-pi-67.vercel.app
      - key: CORS_ORIGINS
        sync: false
